<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Días festivos</title>
    <style>
        * { box-sizing: border-box; }
        body {
          margin: 0;
          min-height: 100vh;
          background: linear-gradient(180deg, #2a1650, #4a2a80 50%, #6b4aa0);
          font-family: 'Georgia', serif;
          color: #f8f1e7;
          padding: 20px;
          padding-top: 64px;
        }
        .wrap { max-width: 720px; margin: 0 auto; }
        h1 { text-align: center; font-weight: normal; color: #f0e0c0; letter-spacing: 1px; }
        a.volver-link {
          display: inline-block; background: rgba(245, 232, 210, 0.16); color: #f8f1e7;
          border: 1px solid rgba(245, 232, 210, 0.3); padding: 6px 14px; border-radius: 999px;
          text-decoration: none; font-family: sans-serif; font-size: 12px; cursor: pointer; margin-bottom: 14px;
        }
        .caja {
          background: rgba(245, 232, 210, 0.14);
          backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
          border: 1px solid rgba(245, 232, 210, 0.28);
          border-radius: 16px; padding: 22px; box-shadow: 0 8px 32px rgba(0,0,0,0.25); margin-bottom: 16px;
        }
        input, textarea {
          width: 100%; padding: 10px; margin: 6px 0; border-radius: 8px;
          border: 1px solid rgba(245, 232, 210, 0.4); background: rgba(255,255,255,0.12);
          color: #fdf8f0; font-family: sans-serif; font-size: 14px;
        }
        textarea { resize: vertical; min-height: 80px; }
        input::placeholder, textarea::placeholder { color: rgba(248,241,231,0.6); }
        label.chica { font-family: sans-serif; font-size: 12px; color: rgba(248,241,231,0.75); display:block; margin-top: 8px; }
        button {
          background: rgba(240, 224, 192, 0.85); color: #3c2166; border: none;
          padding: 10px 18px; border-radius: 8px; font-family: sans-serif; font-size: 14px;
          font-weight: bold; cursor: pointer; margin-top: 6px;
        }
        button:hover { background: #f0e0c0; }
        .btn-bosque { background: linear-gradient(135deg, #1f4d3a, #2d6b4f); color: #f0e0c0; border: 1px solid rgba(240, 224, 192, 0.35); }
        .btn-bosque:hover { background: linear-gradient(135deg, #256045, #35815e); }

        #login, #lista { display: none; }
        #estadoLogin { font-family: sans-serif; font-size: 13px; color: #f0e0c0; margin-top: 6px; }

        .logout-fijo {
          position: fixed; top: 14px; right: 14px; z-index: 60; margin: 0; padding: 8px 14px; font-size: 12px;
          background: linear-gradient(135deg, #1f4d3a, #f0e0c0 140%); color: #1c2e24; box-shadow: 0 4px 14px rgba(0,0,0,0.3);
        }

        .grid-festivos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-top: 10px; }
        .festivo-card {
          position: relative;
          background: rgba(245, 232, 210, 0.14); border: 1px solid rgba(245, 232, 210, 0.28);
          border-radius: 12px; padding: 20px 14px; text-align: center; cursor: pointer;
          transition: transform 0.15s ease, background 0.2s ease;
        }
        .festivo-card:hover { transform: translateY(-2px); background: rgba(245, 232, 210, 0.2); }
        .festivo-icono { font-size: 30px; margin-bottom: 6px; }
        .festivo-nombre { font-family: sans-serif; font-weight: bold; font-size: 13px; color: #f0e0c0; }
        .festivo-acciones { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; }
        .icono-btn {
          background: rgba(20, 10, 35, 0.65); color: #f8f1e7; border: none; border-radius: 6px;
          width: 24px; height: 24px; font-size: 12px; padding: 0; margin: 0; cursor: pointer;
        }
        .icono-btn:hover { background: rgba(20, 10, 35, 0.9); }
        .icono-btn.borrar:hover { background: #8a3030; }
        #vacio { font-family: sans-serif; font-size: 13px; color: rgba(248,241,231,0.7); text-align: center; margin-top: 16px; }

        .opciones-tipo { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
        .opciones-tipo label { font-family: sans-serif; font-size: 13px; display: flex; align-items: center; gap: 4px; }

        /* ---- vista simple de una entrada (texto o iframe) ---- */
        #vistaSimple { position: fixed; inset: 0; z-index: 70; background: #2a1650; display: none; }
        #vistaSimple iframe { width: 100%; height: 100%; border: none; }
        #vistaSimpleTexto { max-width: 480px; margin: 60px auto; }
        .volver-flotante {
          position: fixed; top: 14px; left: 14px; z-index: 80;
          background: rgba(20,10,35,0.75); color: #f8f1e7; border: 1px solid rgba(245,232,210,0.4);
          padding: 8px 14px; border-radius: 999px; font-family: sans-serif; font-size: 12px; cursor: pointer;
        }

        /* ---- pregunta de acceso ---- */
        #pantallaPregunta {
          display: none; position: fixed; inset: 0; z-index: 90;
          background: radial-gradient(circle at center, #4a2a80, #1a0d33 80%);
          align-items: center; justify-content: center; padding: 24px;
        }
        #pantallaPregunta .caja { max-width: 380px; text-align: center; }
        #textoPregunta { font-family: sans-serif; font-size: 16px; margin-bottom: 10px; }
        #errorPregunta { font-family: sans-serif; font-size: 12px; color: #f0a0a0; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Días festivos 🎉</h1>

    <div id="login" class="caja">
        <p style="font-family: sans-serif; margin-top:0;">Inicia sesión</p>
        <input type="email" id="correo" placeholder="correo">
        <input type="password" id="clave" placeholder="contraseña">
        <button onclick="iniciarSesion()">Entrar</button>
        <p id="estadoLogin"></p>
    </div>

    <div id="lista">
        <button class="logout-fijo" onclick="cerrarSesion()">cerrar sesión</button>
        <a class="volver-link" href="../index.html">← volver al menú</a>

        <div class="caja" id="cajaNueva" style="display:none;">
            <p style="font-family: sans-serif; margin-top:0;">Agregar fecha</p>
            <input type="text" id="tituloFestivo" placeholder="título, ej. cumpleaños de mamá">

            <label class="chica">¿Qué tipo de contenido es?</label>
            <div class="opciones-tipo">
                <label><input type="radio" name="tipoFestivo" value="archivo" checked onchange="cambiarTipoFestivo()"> por nombre de archivo</label>
                <label><input type="radio" name="tipoFestivo" value="texto" onchange="cambiarTipoFestivo()"> escribir aquí</label>
                <label><input type="radio" name="tipoFestivo" value="especial" onchange="cambiarTipoFestivo()"> 🌻 experiencia especial (día de la novia)</label>
            </div>

            <div id="campoArchivoFestivo">
                <input type="text" id="archivoFestivo" placeholder="nombre-del-archivo.html">
            </div>
            <div id="campoTextoFestivo" style="display:none;">
                <textarea id="textoFestivo" placeholder="escribe el mensaje aquí..."></textarea>
            </div>
            <div id="campoEspecialFestivo" style="display:none;">
                <p style="font-family: sans-serif; font-size: 12px; color: rgba(248,241,231,0.75);">
                    esta abrirá automáticamente la experiencia del ramo + carta (dia-novia.html). la música se sube desde ahí mismo, una vez creada.
                </p>
            </div>

            <label class="chica"><input type="checkbox" id="tienePregunta" onchange="togglePregunta()"> tiene una pregunta de acceso antes de abrir</label>
            <div id="campoPregunta" style="display:none;">
                <input type="text" id="preguntaFestivo" placeholder="pregunta, ej. ¿qué día es hoy?">
                <input type="text" id="respuestaFestivo" placeholder="respuesta correcta">
            </div>

            <button class="btn-bosque" onclick="crearFestivo()">Guardar</button>
            <p id="estadoNuevoFestivo" style="font-family: sans-serif; font-size: 12px; color: #f0e0c0;"></p>
        </div>

        <div class="grid-festivos" id="gridFestivos"></div>
        <p id="vacio" style="display:none;">todavía no hay fechas guardadas</p>
    </div>
</div>

<!-- vista simple: texto o archivo por iframe -->
<div id="vistaSimple">
    <button class="volver-flotante" onclick="cerrarVistaSimple()">← volver</button>
    <div id="vistaSimpleTexto" class="caja" style="display:none;"></div>
    <iframe id="iframeSimple" src=""></iframe>
</div>

<!-- pregunta de acceso -->
<div id="pantallaPregunta">
    <div class="caja">
        <p id="textoPregunta"></p>
        <input type="text" id="inputRespuesta" placeholder="escribe tu respuesta">
        <button class="btn-bosque" onclick="continuarPregunta()">continuar</button>
        <p id="errorPregunta"></p>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
    const CORREO_ADMIN = "palrom2006@gmail.com";

    const firebaseConfig = {
      apiKey: "AIzaSyCmTlMDrPpAlLCszeFxPru-AEvtFhEUDzk",
      authDomain: "album-novia-af9cf.firebaseapp.com",
      projectId: "album-novia-af9cf",
      storageBucket: "album-novia-af9cf.firebasestorage.app",
      messagingSenderId: "560485716923",
      appId: "1:560485716923:web:8c2a53f3de42bb3dde2a9e"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
    const db = firebase.firestore();

    let esAdmin = false;
    let festivoPendiente = null;
    let festivoPendienteId = null;

    function iniciarSesion() {
      const correo = document.getElementById('correo').value;
      const clave = document.getElementById('clave').value;
      auth.signInWithEmailAndPassword(correo, clave)
        .catch(() => { document.getElementById('estadoLogin').textContent = "correo o contraseña incorrectos"; });
    }
    function cerrarSesion() { auth.signOut(); }

    auth.onAuthStateChanged(user => {
      if (user) {
        esAdmin = (user.email && user.email.toLowerCase() === CORREO_ADMIN.toLowerCase());
        document.getElementById('login').style.display = 'none';
        document.getElementById('lista').style.display = 'block';
        document.getElementById('cajaNueva').style.display = esAdmin ? 'block' : 'none';
        cargarFestivos();
      } else {
        esAdmin = false;
        document.getElementById('login').style.display = 'block';
        document.getElementById('lista').style.display = 'none';
      }
    });

    function cambiarTipoFestivo() {
      const tipo = document.querySelector('input[name="tipoFestivo"]:checked').value;
      document.getElementById('campoArchivoFestivo').style.display = tipo === 'archivo' ? 'block' : 'none';
      document.getElementById('campoTextoFestivo').style.display = tipo === 'texto' ? 'block' : 'none';
      document.getElementById('campoEspecialFestivo').style.display = tipo === 'especial' ? 'block' : 'none';
    }
    function togglePregunta() {
      document.getElementById('campoPregunta').style.display = document.getElementById('tienePregunta').checked ? 'block' : 'none';
    }

    async function crearFestivo() {
      const titulo = document.getElementById('tituloFestivo').value.trim();
      if (!titulo) { alert('ponle un título'); return; }
      const tipo = document.querySelector('input[name="tipoFestivo"]:checked').value;
      const tienePregunta = document.getElementById('tienePregunta').checked;

      const datos = {
        titulo, tipo,
        archivo: tipo === 'archivo' ? document.getElementById('archivoFestivo').value.trim() : null,
        contenido: tipo === 'texto' ? document.getElementById('textoFestivo').value : null,
        tienePregunta,
        pregunta: tienePregunta ? document.getElementById('preguntaFestivo').value.trim() : null,
        respuesta: tienePregunta ? document.getElementById('respuestaFestivo').value.trim() : null,
        especial: tipo === 'especial' ? 'dia-novia' : null,
        musica: null,
        fecha: Date.now()
      };
      await db.collection('festivos').add(datos);
      document.getElementById('tituloFestivo').value = '';
      document.getElementById('archivoFestivo').value = '';
      document.getElementById('textoFestivo').value = '';
      document.getElementById('preguntaFestivo').value = '';
      document.getElementById('respuestaFestivo').value = '';
      document.getElementById('tienePregunta').checked = false;
      togglePregunta();
      document.getElementById('estadoNuevoFestivo').textContent = 'guardado ✓';
      cargarFestivos();
    }

    async function eliminarFestivo(id) {
      if (!confirm('¿eliminar esta fecha?')) return;
      await db.collection('festivos').doc(id).delete();
      cargarFestivos();
    }

    async function cargarFestivos() {
      const contenedor = document.getElementById('gridFestivos');
      contenedor.innerHTML = '';
      const snap = await db.collection('festivos').orderBy('fecha', 'desc').get();
      document.getElementById('vacio').style.display = snap.empty ? 'block' : 'none';
      snap.forEach(doc => {
        const f = doc.data();
        const div = document.createElement('div');
        div.className = 'festivo-card';
        div.onclick = (e) => { if (!e.target.closest('.festivo-acciones')) abrirFestivo(doc.id, f); };
        let admin = '';
        if (esAdmin) {
          admin = `<div class="festivo-acciones"><button class="icono-btn borrar" onclick="event.stopPropagation(); eliminarFestivo('${doc.id}')">🗑️</button></div>`;
        }
        const icono = f.especial === 'dia-novia' ? '🌻' : '🎉';
        div.innerHTML = `${admin}<div class="festivo-icono">${icono}</div><div class="festivo-nombre"></div>`;
        div.querySelector('.festivo-nombre').textContent = f.titulo;
        contenedor.appendChild(div);
      });
    }

    function abrirFestivo(id, f) {
      if (f.tienePregunta) {
        festivoPendiente = f;
        festivoPendienteId = id;
        document.getElementById('textoPregunta').textContent = f.pregunta;
        document.getElementById('inputRespuesta').value = '';
        document.getElementById('errorPregunta').textContent = '';
        document.getElementById('pantallaPregunta').style.display = 'flex';
      } else {
        mostrarFestivo(id, f);
      }
    }

    function normalizar(str) {
      return (str || '').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function continuarPregunta() {
      const val = document.getElementById('inputRespuesta').value;
      if (normalizar(val) !== normalizar(festivoPendiente.respuesta)) {
        document.getElementById('errorPregunta').textContent = 'esa no es, inténtalo de nuevo 💭';
        return;
      }
      document.getElementById('pantallaPregunta').style.display = 'none';
      mostrarFestivo(festivoPendienteId, festivoPendiente);
    }

    function mostrarFestivo(id, f) {
      if (f.especial === 'dia-novia') {
        window.location.href = 'dia-novia.html?id=' + id;
        return;
      }
      if (f.tipo === 'texto' && f.contenido) {
        document.getElementById('vistaSimpleTexto').style.display = 'block';
        document.getElementById('iframeSimple').style.display = 'none';
        document.getElementById('vistaSimpleTexto').innerHTML = `<p style="white-space:pre-wrap; font-family: 'Georgia', serif; line-height:1.8;">${f.contenido}</p>`;
      } else if (f.tipo === 'archivo' && f.archivo) {
        document.getElementById('vistaSimpleTexto').style.display = 'none';
        document.getElementById('iframeSimple').style.display = 'block';
        document.getElementById('iframeSimple').src = f.archivo;
      } else {
        document.getElementById('vistaSimpleTexto').style.display = 'block';
        document.getElementById('iframeSimple').style.display = 'none';
        document.getElementById('vistaSimpleTexto').innerHTML = `<p style="font-family: sans-serif; font-size: 13px; color: rgba(248,241,231,0.75);">esta fecha todavía no tiene contenido cargado.</p>`;
      }
      document.getElementById('vistaSimple').style.display = 'block';
    }

    function cerrarVistaSimple() {
      document.getElementById('iframeSimple').src = '';
      document.getElementById('vistaSimple').style.display = 'none';
    }
</script>
</body>
</html>
