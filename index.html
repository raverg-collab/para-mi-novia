<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti</title>
    <style>
        * { box-sizing: border-box; }
        body {
          margin: 0;
          min-height: 100vh;
          background: linear-gradient(180deg, #2a1650, #4a2a80 50%, #6b4aa0);
          font-family: 'Georgia', serif;
          color: #f8f1e7;
          padding: 40px 20px;
        }
        .wrap { max-width: 640px; margin: 0 auto; }
        h1 { text-align: center; font-weight: normal; color: #f0e0c0; letter-spacing: 1px; margin-bottom: 8px; }
        .sub { text-align: center; font-family: sans-serif; font-size: 14px; color: rgba(248,241,231,0.7); margin-bottom: 36px; }

        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
          gap: 16px;
        }
        a.card {
          text-decoration: none;
          background: rgba(245, 232, 210, 0.14);
          backdrop-filter: blur(14px);
          -webkit-backdrop-filter: blur(14px);
          border: 1px solid rgba(245, 232, 210, 0.28);
          border-radius: 16px;
          padding: 28px 16px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 10px;
          color: #f8f1e7;
          transition: transform 0.2s ease, background 0.2s ease;
        }
        a.card:hover { transform: translateY(-3px); background: rgba(245, 232, 210, 0.22); }
        .icono {
          width: 56px;
          height: 56px;
          border-radius: 50%;
          background: rgba(240, 224, 192, 0.9);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 26px;
        }
        .nombre { font-family: sans-serif; font-size: 14px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Para ti 💜</h1>
    <p class="sub">toca cualquiera para abrir</p>
    <div class="grid">
        <a class="card" href="bienvenida.html">
            <div class="icono">💌</div>
            <div class="nombre">bienvenida</div>
        </a>
        <a class="card" href="motivacion.html">
            <div class="icono">☀️</div>
            <div class="nombre">motivación</div>
        </a>
        <a class="card" href="album.html">
            <div class="icono">📸</div>
            <div class="nombre">nuestro álbum</div>
        </a>
    </div>
</div>
</body>
</html>
