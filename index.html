<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti</title>
    <style>
        * { box-sizing: border-box; }
        body {
          margin: 0;
          min-height: 100vh;
          background: linear-gradient(180deg, #2a1650, #4a2a80 50%, #6b4aa0);
          font-family: 'Georgia', serif;
          color: #f8f1e7;
          padding: 40px 20px;
          display: flex;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
        }
        #collageFondo {
          position: fixed; inset: 0; z-index: 0;
          display: grid;
          grid-template-columns: repeat(auto-fill, 110px);
          grid-auto-rows: 110px;
          gap: 5px;
          justify-content: center;
          opacity: 0.5;
          filter: blur(1px) saturate(0.85);
        }
        #collageFondo img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
        #collageVeladura {
          position: fixed; inset: 0; z-index: 1;
          background: linear-gradient(180deg, rgba(42,22,80,0.72), rgba(74,42,128,0.68) 50%, rgba(107,74,160,0.72));
        }
        .wrap { position: relative; z-index: 2; }
        .wrap { max-width: 640px; width: 100%; margin: 0 auto; }
        h1 { text-align: center; font-weight: normal; color: #f0e0c0; letter-spacing: 1px; margin-bottom: 8px; }
        .sub { text-align: center; font-family: sans-serif; font-size: 14px; color: rgba(248,241,231,0.7); margin-bottom: 24px; }
        .caja {
          background: rgba(245, 232, 210, 0.14);
          backdrop-filter: blur(14px);
          -webkit-backdrop-filter: blur(14px);
          border: 1px solid rgba(245, 232, 210, 0.28);
          border-radius: 16px;
          padding: 26px;
          box-shadow: 0 8px 32px rgba(0,0,0,0.25);
          max-width: 340px;
          margin: 0 auto;
        }
        input {
          width: 100%;
          padding: 10px;
          margin: 6px 0;
          border-radius: 8px;
          border: 1px solid rgba(245, 232, 210, 0.4);
          background: rgba(255,255,255,0.12);
          color: #fdf8f0;
          font-family: sans-serif;
          font-size: 14px;
        }
        input::placeholder { color: rgba(248,241,231,0.6); }
        button {
          width: 100%;
          background: rgba(240, 224, 192, 0.85);
          color: #3c2166;
          border: none;
          padding: 10px 18px;
          border-radius: 8px;
          font-family: sans-serif;
          font-size: 14px;
          font-weight: bold;
          cursor: pointer;
          margin-top: 6px;
        }
        button:hover { background: #f0e0c0; }
        #estadoLogin { font-family: sans-serif; font-size: 13px; color: #f0e0c0; margin-top: 6px; text-align: center; }
        #menu { display: none; }
        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
          gap: 16px;
        }
        a.card {
          text-decoration: none;
          background: rgba(245, 232, 210, 0.14);
          backdrop-filter: blur(14px);
          -webkit-backdrop-filter: blur(14px);
          border: 1px solid rgba(245, 232, 210, 0.28);
          border-radius: 16px;
          padding: 28px 16px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 10px;
          color: #f8f1e7;
          transition: transform 0.2s ease, background 0.2s ease;
        }
        a.card:hover { transform: translateY(-3px); background: rgba(245, 232, 210, 0.22); }
        .icono {
          width: 56px;
          height: 56px;
          border-radius: 50%;
          background: rgba(240, 224, 192, 0.9);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 26px;
        }
        .nombre { font-family: sans-serif; font-size: 14px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
<div id="collageFondo"></div>
<div id="collageVeladura"></div>
<div class="wrap">
    <h1>Para ti 💜</h1>

    <div id="login">
        <p class="sub">inicia sesión para entrar</p>
        <div class="caja">
            <input type="email" id="correo" placeholder="correo">
            <input type="password" id="clave" placeholder="contraseña">
            <button onclick="iniciarSesion()">Entrar</button>
            <p id="estadoLogin"></p>
        </div>
    </div>

    <div id="menu">
        <p class="sub">toca cualquiera para abrir</p>
        <div class="grid">
            <a class="card" href="cartas.html">
                <div class="icono">💌</div>
                <div class="nombre">cartas</div>
            </a>
            <a class="card" href="album.html">
                <div class="icono">📸</div>
                <div class="nombre">nuestro álbum</div>
            </a>
            <a class="card" href="festivos.html">
                <div class="icono">🎉</div>
                <div class="nombre">días festivos</div>
            </a>
        </div>
    </div>
</div>

<script>
    const FOTOS_COLLAGE = [
      "https://res.cloudinary.com/nrfykjzk/image/upload/v1785785634/IMG-20260802-WA0103_disrne.jpg",
      "https://res.cloudinary.com/nrfykjzk/image/upload/v1785785630/IMG-20260802-WA0082_faxfvd.jpg",
      "https://res.cloudinary.com/nrfykjzk/image/upload/v1785785557/IMG-20260802-WA0072_vw5sfq.jpg",
      "https://res.cloudinary.com/nrfykjzk/image/upload/v1785785554/IMG-20260802-WA0055_mzyi8d.jpg",
      "https://res.cloudinary.com/nrfykjzk/image/upload/v1785785493/IMG-20260802-WA0054_xthuta.jpg",
      "https://res.cloudinary.com/nrfykjzk/image/upload/v1785785338/IMG-20260802-WA0014_hjsvsl.jpg",
      "https://res.cloudinary.com/nrfykjzk/image/upload/v1785785313/IMG-20260802-WA0004_k9pi3j.jpg",
      "https://res.cloudinary.com/nrfykjzk/image/upload/v1785785276/IMG-20260802-WA0011_1_juwuxg.jpg",
      "https://res.cloudinary.com/nrfykjzk/image/upload/v1785785141/IMG-20260802-WA0003_vtnnbk.jpg",
      "https://res.cloudinary.com/nrfykjzk/image/upload/v1785784779/IMG_20260620_200356_076_jh2rwc.jpg"
    ];

    function poblarCollage() {
      const cont = document.getElementById('collageFondo');
      const columnas = Math.ceil(window.innerWidth / 115);
      const filas = Math.ceil(window.innerHeight / 115);
      const total = columnas * filas;
      let indices = [];
      for (let i = 0; i < total; i++) indices.push(i % FOTOS_COLLAGE.length);
      // baraja para que no quede un patron repetitivo obvio
      for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
      }
      cont.innerHTML = '';
      indices.forEach(idx => {
        const img = document.createElement('img');
        img.src = FOTOS_COLLAGE[idx];
        img.loading = 'lazy';
        cont.appendChild(img);
      });
    }
    poblarCollage();
    window.addEventListener('resize', poblarCollage);
</script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCmTlMDrPpAlLCszeFxPru-AEvtFhEUDzk",
      authDomain: "album-novia-af9cf.firebaseapp.com",
      projectId: "album-novia-af9cf",
      storageBucket: "album-novia-af9cf.firebasestorage.app",
      messagingSenderId: "560485716923",
      appId: "1:560485716923:web:8c2a53f3de42bb3dde2a9e"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

    function iniciarSesion() {
      const correo = document.getElementById('correo').value;
      const clave = document.getElementById('clave').value;
      auth.signInWithEmailAndPassword(correo, clave)
        .catch(err => { document.getElementById('estadoLogin').textContent = "correo o contraseña incorrectos"; });
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('menu').style.display = 'block';
      } else {
        document.getElementById('login').style.display = 'block';
        document.getElementById('menu').style.display = 'none';
      }
    });
</script>
</body>
</html>
