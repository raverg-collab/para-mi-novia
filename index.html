<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti</title>
    <style>
        * { box-sizing: border-box; }
        body {
          margin: 0;
          min-height: 100vh;
          background: linear-gradient(180deg, #2a1650, #4a2a80 50%, #6b4aa0);
          font-family: 'Georgia', serif;
          color: #f8f1e7;
          padding: 40px 20px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .wrap { max-width: 640px; width: 100%; margin: 0 auto; }
        h1 { text-align: center; font-weight: normal; color: #f0e0c0; letter-spacing: 1px; margin-bottom: 8px; }
        .sub { text-align: center; font-family: sans-serif; font-size: 14px; color: rgba(248,241,231,0.7); margin-bottom: 24px; }
        .caja {
          background: rgba(245, 232, 210, 0.14);
          backdrop-filter: blur(14px);
          -webkit-backdrop-filter: blur(14px);
          border: 1px solid rgba(245, 232, 210, 0.28);
          border-radius: 16px;
          padding: 26px;
          box-shadow: 0 8px 32px rgba(0,0,0,0.25);
          max-width: 340px;
          margin: 0 auto;
        }
        input {
          width: 100%;
          padding: 10px;
          margin: 6px 0;
          border-radius: 8px;
          border: 1px solid rgba(245, 232, 210, 0.4);
          background: rgba(255,255,255,0.12);
          color: #fdf8f0;
          font-family: sans-serif;
          font-size: 14px;
        }
        input::placeholder { color: rgba(248,241,231,0.6); }
        button {
          width: 100%;
          background: rgba(240, 224, 192, 0.85);
          color: #3c2166;
          border: none;
          padding: 10px 18px;
          border-radius: 8px;
          font-family: sans-serif;
          font-size: 14px;
          font-weight: bold;
          cursor: pointer;
          margin-top: 6px;
        }
        button:hover { background: #f0e0c0; }
        #estadoLogin { font-family: sans-serif; font-size: 13px; color: #f0e0c0; margin-top: 6px; text-align: center; }
        #menu { display: none; }
        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
          gap: 16px;
        }
        a.card {
          text-decoration: none;
          background: rgba(245, 232, 210, 0.14);
          backdrop-filter: blur(14px);
          -webkit-backdrop-filter: blur(14px);
          border: 1px solid rgba(245, 232, 210, 0.28);
          border-radius: 16px;
          padding: 28px 16px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 10px;
          color: #f8f1e7;
          transition: transform 0.2s ease, background 0.2s ease;
        }
        a.card:hover { transform: translateY(-3px); background: rgba(245, 232, 210, 0.22); }
        .icono {
          width: 56px;
          height: 56px;
          border-radius: 50%;
          background: rgba(240, 224, 192, 0.9);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 26px;
        }
        .nombre { font-family: sans-serif; font-size: 14px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Para ti 💜</h1>

    <div id="login">
        <p class="sub">inicia sesión para entrar</p>
        <div class="caja">
            <input type="email" id="correo" placeholder="correo">
            <input type="password" id="clave" placeholder="contraseña">
            <button onclick="iniciarSesion()">Entrar</button>
            <p id="estadoLogin"></p>
        </div>
    </div>

    <div id="menu">
        <p class="sub">toca cualquiera para abrir</p>
        <div class="grid">
            <a class="card" href="cartas.html">
                <div class="icono">💌</div>
                <div class="nombre">cartas</div>
            </a>
            <a class="card" href="album.html">
                <div class="icono">📸</div>
                <div class="nombre">nuestro álbum</div>
            </a>
            <a class="card" href="festivos.html">
                <div class="icono">🎉</div>
                <div class="nombre">días festivos</div>
            </a>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCmTlMDrPpAlLCszeFxPru-AEvtFhEUDzk",
      authDomain: "album-novia-af9cf.firebaseapp.com",
      projectId: "album-novia-af9cf",
      storageBucket: "album-novia-af9cf.firebasestorage.app",
      messagingSenderId: "560485716923",
      appId: "1:560485716923:web:8c2a53f3de42bb3dde2a9e"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

    function iniciarSesion() {
      const correo = document.getElementById('correo').value;
      const clave = document.getElementById('clave').value;
      auth.signInWithEmailAndPassword(correo, clave)
        .catch(err => { document.getElementById('estadoLogin').textContent = "correo o contraseña incorrectos"; });
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('menu').style.display = 'block';
      } else {
        document.getElementById('login').style.display = 'block';
        document.getElementById('menu').style.display = 'none';
      }
    });
</script>
</body>
</html>
